<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Buddy | Student Task Manager</title>
  
  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Font Awesome Icons for clean student UI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- Embedded Modern Styling (Guarantees zero plain-text fallback on production/Vercel) -->
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --secondary: #06b6d4;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-shape {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.45;
    }

    .shape-1 {
      width: 320px;
      height: 320px;
      background: #c7d2fe;
      top: -60px;
      right: -60px;
    }

    .shape-2 {
      width: 360px;
      height: 360px;
      background: #cffafe;
      bottom: -80px;
      left: -80px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 8px 4px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .app-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .stats-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      box-shadow: var(--shadow-sm);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-number {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .stat-number.text-success {
      color: var(--success);
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .stat-divider {
      width: 1px;
      height: 32px;
      background-color: var(--border-color);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title i {
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .flex-1 {
      flex: 1;
      min-width: 180px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    input[type="text"],
    input[type="date"],
    select {
      width: 100%;
      padding: 11px 14px 11px 40px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      background: #fdfdfd;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    }

    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .tasks-header .section-title {
      margin-bottom: 0;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      background-color: var(--bg-page);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .filter-btn {
      background: transparent;
      border: none;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .filter-btn:hover {
      color: var(--text-main);
    }

    .filter-btn.active {
      background-color: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
      font-weight: 700;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
      gap: 12px;
    }

    .task-item:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
      position: relative;
    }

    .custom-checkbox:hover {
      border-color: var(--primary);
    }

    .custom-checkbox:checked {
      background-color: var(--success);
      border-color: var(--success);
    }

    .custom-checkbox:checked::after {
      content: "✔";
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      position: absolute;
    }

    .task-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-word;
      transition: color 0.15s ease;
    }

    .task-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .task-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 600;
    }

    .category-badge {
      background-color: var(--primary-light);
      color: var(--primary);
    }

    .priority-high {
      background-color: var(--danger-light);
      color: var(--danger);
    }

    .priority-medium {
      background-color: var(--warning-light);
      color: var(--warning);
    }

    .priority-low {
      background-color: #f1f5f9;
      color: #475569;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .date-badge.overdue {
      color: var(--danger);
      font-weight: 700;
    }

    .task-item.completed {
      background-color: #f8fafc;
      opacity: 0.8;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-icon-danger {
      background: transparent;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s ease;
    }

    .btn-icon-danger:hover {
      background-color: var(--danger-light);
      color: var(--danger);
      transform: scale(1.05);
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .empty-state.show {
      display: block;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state h3 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .empty-state p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .app-footer {
      text-align: center;
      padding: 16px 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      body {
        padding: 16px 10px;
      }
      .card {
        padding: 18px 14px;
      }
      .app-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .form-row {
        flex-direction: column;
        gap: 0;
      }
      .flex-1 {
        min-width: 100%;
      }
      .tasks-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .filter-tabs {
        width: 100%;
        justify-content: space-between;
      }
      .filter-btn {
        flex: 1;
        text-align: center;
      }
      .task-item {
        padding: 12px 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Background decorative blur circles -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h1>Campus Buddy</h1>
          <p class="tagline">Your Student Task Manager</p>
        </div>
      </div>
      <div class="header-badges">
        <span class="badge" id="dateBadge">
          <i class="fa-regular fa-calendar"></i> <span id="currentDateText">Today</span>
        </span>
      </div>
    </header>

    <!-- Overview Stats Bar -->
    <section class="stats-card">
      <div class="stat-item">
        <span class="stat-number" id="totalTasksCount">0</span>
        <span class="stat-label">Total Tasks</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-number" id="pendingTasksCount">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-number text-success" id="completedTasksCount">0</span>
        <span class="stat-label">Completed</span>
      </div>
    </section>

    <!-- Task Input Form -->
    <section class="card form-card">
      <h2 class="section-title">
        <i class="fa-solid fa-circle-plus"></i> Add New Task
      </h2>
      <form id="taskForm">
        <div class="form-group">
          <label for="taskTitle">Task Name / Description</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-pen-nib input-icon"></i>
            <input
              type="text"
              id="taskTitle"
              placeholder="e.g., Submit Chemistry Lab Report, Math Assignment 3..."
              required
              autocomplete="off"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="taskDueDate">Due Date</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-calendar-days input-icon"></i>
              <input type="date" id="taskDueDate" required />
            </div>
          </div>

          <div class="form-group flex-1">
            <label for="taskCategory">Category</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-tag input-icon"></i>
              <select id="taskCategory">
                <option value="Assignment">📝 Assignment</option>
                <option value="Exam Prep">📚 Exam Prep</option>
                <option value="Lab Work">🔬 Lab Work</option>
                <option value="Project">💻 Project</option>
                <option value="Personal">⭐ Personal</option>
              </select>
            </div>
          </div>

          <div class="form-group flex-1">
            <label for="taskPriority">Priority</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-flag input-icon"></i>
              <select id="taskPriority">
                <option value="Medium">Medium</option>
                <option value="High">High 🚨</option>
                <option value="Low">Low</option>
              </select>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="addTaskBtn">
          <i class="fa-solid fa-plus"></i> Add Task
        </button>
      </form>
    </section>

    <!-- Task List & Filters Section -->
    <section class="card tasks-card">
      <div class="tasks-header">
        <h2 class="section-title">
          <i class="fa-solid fa-list-check"></i> My Tasks
        </h2>

        <!-- Filter tabs: All, Pending, Completed -->
        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
      </div>

      <!-- Task List Container -->
      <div id="taskList" class="task-list">
        <!-- Tasks will be injected dynamically by JavaScript -->
      </div>

      <!-- Empty State (Shown when no tasks exist) -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">🎒</div>
        <h3>No tasks found!</h3>
        <p>Add your first study task above to keep your semester on track.</p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Built for students with ❤️ &bull; Campus Buddy &bull; Ready for Supabase & Vercel</p>
    </footer>
  </div>

  <!-- External JavaScript -->
  <script src="script.js"></script>

  <!-- Fallback Inline Script (Ensures immediate functionality even if script.js is missing on production) -->
  <script>
    (function() {
      // Guard to prevent running twice if script.js also executed
      if (window.campusBuddyInitialized) return;
      window.campusBuddyInitialized = true;

      const taskForm = document.getElementById("taskForm");
      const taskTitleInput = document.getElementById("taskTitle");
      const taskDueDateInput = document.getElementById("taskDueDate");
      const taskCategoryInput = document.getElementById("taskCategory");
      const taskPriorityInput = document.getElementById("taskPriority");
      const taskListContainer = document.getElementById("taskList");
      const emptyState = document.getElementById("emptyState");
      const filterButtons = document.querySelectorAll(".filter-btn");

      const totalTasksCount = document.getElementById("totalTasksCount");
      const pendingTasksCount = document.getElementById("pendingTasksCount");
      const completedTasksCount = document.getElementById("completedTasksCount");
      const currentDateText = document.getElementById("currentDateText");

      let tasks = JSON.parse(localStorage.getItem("campusBuddyTasks")) || [];
      let currentFilter = "all";

      function setupDates() {
        const today = new Date();
        const options = { month: "short", day: "numeric", year: "numeric" };
        currentDateText.textContent = today.toLocaleDateString("en-US", options);

        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, "0");
        const dd = String(today.getDate()).padStart(2, "0");
        taskDueDateInput.value = `${yyyy}-${mm}-${dd}`;
      }

      function saveTasks() {
        localStorage.setItem("campusBuddyTasks", JSON.stringify(tasks));
      }

      function updateStats() {
        const total = tasks.length;
        const completed = tasks.filter((t) => t.isCompleted).length;
        const pending = total - completed;

        totalTasksCount.textContent = total;
        completedTasksCount.textContent = completed;
        pendingTasksCount.textContent = pending;
      }

      function addTask(event) {
        event.preventDefault();

        const title = taskTitleInput.value.trim();
        const dueDate = taskDueDateInput.value;
        const category = taskCategoryInput.value;
        const priority = taskPriorityInput.value;

        if (!title || !dueDate) {
          alert("Please fill in both the task name and the due date!");
          return;
        }

        const newTask = {
          id: Date.now().toString(),
          title: title,
          dueDate: dueDate,
          category: category,
          priority: priority,
          isCompleted: false,
          createdAt: new Date().toISOString(),
        };

        tasks.unshift(newTask);
        saveTasks();
        renderTasks();
        updateStats();

        taskTitleInput.value = "";
        taskTitleInput.focus();
      }

      function toggleTask(id) {
        tasks = tasks.map((task) => {
          if (task.id === id) {
            return { ...task, isCompleted: !task.isCompleted };
          }
          return task;
        });
        saveTasks();
        renderTasks();
        updateStats();
      }

      function deleteTask(id) {
        if (!confirm("Are you sure you want to delete this task?")) return;
        tasks = tasks.filter((task) => task.id !== id);
        saveTasks();
        renderTasks();
        updateStats();
      }

      function formatDisplayDate(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split("-");
        if (parts.length === 3) {
          const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
          return dateObj.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        }
        return dateStr;
      }

      function isDateOverdue(dateStr, isCompleted) {
        if (isCompleted || !dateStr) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const parts = dateStr.split("-");
        const dueDate = new Date(parts[0], parts[1] - 1, parts[2]);
        return dueDate < today;
      }

      function renderTasks() {
        taskListContainer.innerHTML = "";
        const filteredTasks = tasks.filter((task) => {
          if (currentFilter === "pending") return !task.isCompleted;
          if (currentFilter === "completed") return task.isCompleted;
          return true;
        });

        if (filteredTasks.length === 0) {
          emptyState.classList.add("show");
        } else {
          emptyState.classList.remove("show");
        }

        filteredTasks.forEach((task) => {
          const taskItem = document.createElement("div");
          taskItem.className = `task-item ${task.isCompleted ? "completed" : ""}`;

          const overdue = isDateOverdue(task.dueDate, task.isCompleted);
          const priorityClass = `priority-${task.priority.toLowerCase()}`;

          taskItem.innerHTML = `
            <div class="task-left">
              <input 
                type="checkbox" 
                class="custom-checkbox" 
                ${task.isCompleted ? "checked" : ""} 
                title="Mark task as ${task.isCompleted ? "pending" : "completed"}"
              />
              <div class="task-details">
                <span class="task-title">${escapeHTML(task.title)}</span>
                <div class="task-meta">
                  <span class="task-badge category-badge">
                    ${escapeHTML(task.category)}
                  </span>
                  <span class="task-badge ${priorityClass}">
                    ${escapeHTML(task.priority)}
                  </span>
                  <span class="date-badge ${overdue ? "overdue" : ""}">
                    <i class="fa-regular fa-clock"></i> 
                    ${overdue ? "Overdue: " : "Due: "} ${formatDisplayDate(task.dueDate)}
                  </span>
                </div>
              </div>
            </div>
            <div class="task-actions">
              <button class="btn-icon-danger delete-btn" title="Delete task">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          `;

          const checkbox = taskItem.querySelector(".custom-checkbox");
          checkbox.addEventListener("change", () => toggleTask(task.id));

          const deleteBtn = taskItem.querySelector(".delete-btn");
          deleteBtn.addEventListener("click", () => deleteTask(task.id));

          taskListContainer.appendChild(taskItem);
        });
      }

      function escapeHTML(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      taskForm.addEventListener("submit", addTask);

      filterButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          filterButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          renderTasks();
        });
      });

      setupDates();
      renderTasks();
      updateStats();
    })();
  </script>
</body>
</html>
